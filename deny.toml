[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
unused-allowed-license = "allow"
# Only the conformance runner depends on these, through cucumber's macros.
exceptions = [
    { crate = "synthez", allow = ["BlueOak-1.0.0"] },
    { crate = "synthez-codegen", allow = ["BlueOak-1.0.0"] },
    { crate = "synthez-core", allow = ["BlueOak-1.0.0"] },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
