name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: itinera-dev/actions/release-gate@v1
        with:
          manifest: Cargo.toml
          tier: 1

  # Checks on main do not block anything once a pull request has merged,
  # so the tagged commit passes every check again before it is published.
  ci:
    name: CI
    needs: gate
    uses: ./.github/workflows/ci.yml

  publish:
    name: crates.io
    needs: ci
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: itinera-dev/actions/publish-crates@v1

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # CI's conformance job uploads this report.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conformance-report
          path: conformance-report/
      - uses: itinera-dev/actions/create-release@v1
