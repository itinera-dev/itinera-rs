[package]
name = "itinera-core"
description = "The core of Itinera, a workflow framework that keeps business rules separate from flow control."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
async = ["itinera-macros/async"]
macros = ["dep:itinera-macros"]
testing = []
unstable = []

[dependencies]
async-trait.workspace = true
serde.workspace = true
erased-serde.workspace = true
derive_more = { workspace = true, features = ["into_iterator"] }
getrandom.workspace = true
itinera-macros = { workspace = true, optional = true }
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
itinera = { path = "../itinera", default-features = false }
rstest.workspace = true
serde_json.workspace = true

[lints]
workspace = true

# docs.rs builds the default features only, which leave out the macros, the asynchronous mode and the testing tools.
[package.metadata.docs.rs]
features = ["async", "macros", "testing"]
