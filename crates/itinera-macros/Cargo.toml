[package]
name = "itinera-macros"
description = "The procedural macros of Itinera, a workflow framework that keeps business rules separate from flow control."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lib]
proc-macro = true

[features]
async = []

[dependencies]
derive_more.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
itinera = { path = "../itinera", features = ["async"] }
rstest.workspace = true

[lints]
workspace = true

# docs.rs builds the default features only, which leave out the asynchronous mode.
[package.metadata.docs.rs]
features = ["async"]
