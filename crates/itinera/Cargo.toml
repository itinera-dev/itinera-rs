[package]
name = "itinera"
description = "A workflow framework that keeps business rules separate from flow control."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[features]
default = ["macros"]
macros = ["itinera-core/macros"]
async = ["itinera-core/async"]
unstable = ["itinera-core/unstable"]

[dependencies]
itinera-core.workspace = true

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
rstest.workspace = true
serde_json.workspace = true
trybuild.workspace = true

[[example]]
name = "orders"
required-features = ["macros", "unstable"]

[[example]]
name = "orders_async"
required-features = ["macros", "async", "unstable"]

[[example]]
name = "orders_by_hand"
required-features = ["unstable"]

[lints]
workspace = true
