[package]
name = "itinera"
description = "A workflow framework that keeps business rules separate from flow control."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
exclude = ["/tests/"]

[features]
default = ["macros"]
macros = ["itinera-core/macros"]
async = ["itinera-core/async"]
testing = ["itinera-core/testing"]
unstable = ["itinera-core/unstable"]

[dependencies]
itinera-core.workspace = true

[dev-dependencies]
derive_more.workspace = true
futures = { workspace = true, features = ["executor"] }
itinera-core = { workspace = true, features = ["testing"] }
proptest.workspace = true
rstest.workspace = true
serde_json.workspace = true
trybuild.workspace = true

[[example]]
name = "orders"
required-features = ["macros"]

[[example]]
name = "orders_async"
required-features = ["macros", "async"]

[lints]
workspace = true

# docs.rs builds the default features only, which leave out the asynchronous mode and the testing tools.
[package.metadata.docs.rs]
features = ["async", "macros", "testing"]
