[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/itinera-dev/itinera-rs"

[workspace.dependencies]
itinera-core = { path = "crates/itinera-core", version = "0.0.0" }
itinera-macros = { path = "crates/itinera-macros", version = "0.0.0" }
serde = { version = "1", default-features = false, features = ["std"] }
derive_more = { version = "2.1.1", default-features = false, features = ["std", "display", "from", "into", "as_ref"] }
erased-serde = { version = "0.4", default-features = false, features = ["std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
cucumber = { version = "0.23", default-features = false, features = ["macros", "output-json"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["rt"] }
thiserror = { version = "2", default-features = false, features = ["std"] }

[workspace.lints.rust]
missing_docs = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
